<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" viewBox="0 0 800 200" role="img">
<title>Cálculo de la nota: instrumentos → RA → nota final</title>
<rect width="800" height="200" fill="#F7F9FC"/>
<text x="400" y="24" text-anchor="middle" font-family="Amazon Ember, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#232F3E">Cómo se calcula la nota del módulo</text>
<rect x="30" y="50" width="170" height="100" rx="4" fill="#fff" stroke="#0077b6" stroke-width="2"/>
<rect x="30" y="50" width="170" height="26" fill="#0077b6"/>
<text x="115" y="68" text-anchor="middle" font-family="Amazon Ember, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#fff">Paso 1</text>
<text x="115" y="100" text-anchor="middle" font-family="Amazon Ember, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="500" fill="#232F3E">Instrumentos</text>
<text x="115" y="118" text-anchor="middle" font-family="Amazon Ember, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="500" fill="#232F3E">AC · PR · PY · PO</text>
<line x1="200" y1="100" x2="230" y2="100" stroke="#545B64" stroke-width="2"/>
<polygon points="230,94 240,100 230,106" fill="#545B64"/>
<rect x="230" y="50" width="170" height="100" rx="4" fill="#fff" stroke="#0077b6" stroke-width="2"/>
<rect x="230" y="50" width="170" height="26" fill="#0077b6"/>
<text x="315" y="68" text-anchor="middle" font-family="Amazon Ember, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#fff">Paso 2</text>
<text x="315" y="100" text-anchor="middle" font-family="Amazon Ember, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="500" fill="#232F3E">Nota de cada RA</text>
<text x="315" y="118" text-anchor="middle" font-family="Amazon Ember, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="500" fill="#232F3E">media de actividades</text>
<line x1="400" y1="100" x2="430" y2="100" stroke="#545B64" stroke-width="2"/>
<polygon points="430,94 440,100 430,106" fill="#545B64"/>
<rect x="430" y="50" width="170" height="100" rx="4" fill="#fff" stroke="#0077b6" stroke-width="2"/>
<rect x="430" y="50" width="170" height="26" fill="#0077b6"/>
<text x="515" y="68" text-anchor="middle" font-family="Amazon Ember, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#fff">Paso 3</text>
<text x="515" y="100" text-anchor="middle" font-family="Amazon Ember, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="500" fill="#232F3E">Nota final</text>
<text x="515" y="118" text-anchor="middle" font-family="Amazon Ember, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="500" fill="#232F3E">RA×20/25/30/25 %</text>
<rect x="640" y="60" width="140" height="80" rx="4" fill="#fff" stroke="#C925D1" stroke-width="2"/>
<text x="710" y="95" text-anchor="middle" font-family="Amazon Ember, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#C925D1">+1 CLF-C02</text>
<text x="710" y="115" text-anchor="middle" font-family="Amazon Ember, Segoe UI, Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#545B64">si Aules lo</text>
<text x="710" y="130" text-anchor="middle" font-family="Amazon Ember, Segoe UI, Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#545B64">concede</text>
<line x1="710" y1="140" x2="710" y2="160" stroke="#C925D1" stroke-width="1.5" stroke-dasharray="4 3"/>
<line x1="600" y1="160" x2="710" y2="160" stroke="#C925D1" stroke-width="1.5" stroke-dasharray="4 3"/>
<line x1="600" y1="160" x2="600" y2="150" stroke="#C925D1" stroke-width="1.5" stroke-dasharray="4 3"/>
</svg>